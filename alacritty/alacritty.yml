# ~/.config/alacritty/alacritty.yml
font:
  normal:
    family: "PlemolJP Console NF" # Ganti dengan "IBM Plex Mono" jika diinginkan
    style: Regular
  bold:
    family: "PlemolJP Console NF"
    style: Bold
  italic:
    family: "PlemolJP Console NF"
    style: Italic
  bold_italic:
    family: "PlemolJP Console NF"
    style: Bold Italic
  size: 12.0

window:
  padding:
    x: 10
    y: 10
  opacity: 0.6 # Transparansi (0.0 = transparan penuh, 1.0 = tidak transparan)

shell:
  program: /bin/zsh # Gunakan Zsh sebagai shell default
  args:
    - --login
