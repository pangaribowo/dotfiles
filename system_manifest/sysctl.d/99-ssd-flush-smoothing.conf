# /etc/sysctl.d/99-ssd-flush-smoothing.conf
# Unified Virtual Memory, Dirty Writeback Smoothing, and ZRAM Performance Tuning

# Deterministic Byte-based Dirty Limits (Prevents uncontrolled buffering onto USB BOT bus)
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 67108864

# Periodic Flush Cadence (5-second writeback interval aligned with ext4 commit=5)
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 500

# ZRAM In-Memory Compression Optimization
vm.swappiness = 180
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
