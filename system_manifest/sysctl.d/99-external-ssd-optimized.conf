# ==============================================================================
# Optimasi untuk Ubuntu di SSD Eksternal ADATA SU650 (DRAM-less) via USB
# Dibuat: 2026-09-23 oleh Antigravity SSD Optimizer
# ==============================================================================

# 1. Swappiness: Gunakan ZRAM secara agresif, tetapi kurangi dari 180
#    180 terlalu tinggi - menyebabkan overhead kompresi berlebihan
#    150 sudah optimal untuk ZRAM pada sistem 8GB RAM
vm.swappiness = 150

# 2. Page cluster 0: ZRAM tidak punya seek time, baca 1 halaman sekaligus
vm.page-cluster = 0

# 3. Cache pressure: Jaga cache filesystem di RAM, kurangi akses disk
vm.vfs_cache_pressure = 50

# 4. Dirty memory: Tulis data ke disk secara perlahan agar SSD tidak tersedak
#    dirty_ratio 10%: Maksimum RAM yang boleh kotor sebelum dipaksa tulis
#    dirty_background_ratio 3%: Mulai tulis background saat 3% RAM kotor
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3

# 5. Dirty expiry & writeback: Beri lebih banyak waktu sebelum flush ke disk
#    Mengurangi frekuensi tulis ke SSD DRAM-less yang lambat saat burst
vm.dirty_expire_centisecs = 6000
vm.dirty_writeback_centisecs = 3000

# 6. Anti-thrashing watermark
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# 7. Magic SysRq: Aktifkan semua fungsi untuk safe reboot saat hang
kernel.sysrq = 1

# 8. inotify: Tingkatkan batas watch untuk IDE dan tools dev
fs.inotify.max_user_watches = 524288
