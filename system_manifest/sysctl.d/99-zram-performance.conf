# ==============================================================================
# Anti-Freeze & ZRAM High-Throughput Memory Settings
# ==============================================================================

# 1. Swappiness tinggi untuk memaksimalkan kompresi ZRAM di RAM
# ZRAM berkecepatan 5-10 GB/s di RAM. Membiarkan tab pasif terkompresi
# menjaga page cache tetap utuh dan mencegah disk I/O lockup/freeze.
vm.swappiness = 180

# 2. Page cluster 0: ZRAM tidak punya waktu putar/seek disk.
# Membaca 1 halaman (4KB) sekaligus memangkas latensi dekompresi seketika.
vm.page-cluster = 0

# 3. Cache pressure: Menjaga cache direktori & inode file tetap di RAM
vm.vfs_cache_pressure = 50

# 4. Dirty memory throttling: Menulis perubahan memori ke disk secara bertahap
# Mencegah sistem freeze saat proses browser/aplikasi menulis data besar sekaligus.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# 5. Anti-thrashing watermark: Mencegah kernel panik membuang cache tiba-tiba
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
