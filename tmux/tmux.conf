# ~/.config/tmux/tmux.conf

# Terminal settings
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -g -a terminal-features ",xterm-256color:RGB"
set -g -a terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[2 q" # nvim cursor fix

set-option -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set-option -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Alacritty
set-option -as terminal-features ",alacritty:RGB"

# Use Vim key bindings
set-option -g mode-keys vi
set-option -g status-keys vi

# Mouse support
set-option -g mouse on

# Responsiveness
set-option -g escape-time 0
set-option -g repeat-time 0 # 600

# Enable focus events
set-option -g focus-events on

# History settings
set-option -g history-limit 100000
set-option -g history-file ~/.tmux/tmuxhistory

# Activity monitoring
set-option -g monitor-activity on
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none

# Window and pane indexing
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g -w automatic-rename on

# Prefix settings
unbind C-b
set-option -g prefix C-t
bind C-t send-prefix

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"
bind o run-shell "xdg-open '#{pane_current_path}'"

# Split pane (default bindings)
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind-key '_' split-window -fv -c "#{pane_current_path}"
bind-key '|' split-window -fh -c "#{pane_current_path}"

# Smart pane switching with Vim awareness
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U" 
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R" # Pane resizing 

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane management
bind -r < swap-pane -U
bind -r > swap-pane -D
bind -r e kill-pane -a

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window
bind w new-window -c "#{pane_current_path}"
bind n command-prompt "rename-window '%%'"

# Window management
bind X kill-window

# Copy mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel

# Paste
bind p paste-buffer

# Search in copy mode
bind / copy-mode \; send-keys "/"
bind ? copy-mode \; send-keys "?"

# Zoom pane
bind -n M-z resize-pane -Z

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

### Status Bar Update
set -g status on
set -g status-position top # bottom
set -g status-interval 1
set -g status-justify "left"
set -g status-style "fg=#586e75,bg=#073642"
set -g status-bg "#002b36"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-right "#{?$tm_tunes,${tm_tunes_display},} "
set -g status-left "#[fg=#073642,bg=#eee8d5,bold] #S #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=#002b36]"
set -g status-right "#[fg=#586e75,bg=#002b36,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h "

